name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pipeline/pyproject.toml
            api/requirements.txt
      - name: Install
        run: |
          pip install -e "pipeline[dev]"
          pip install -r api/requirements.txt
      - name: Ruff
        run: |
          ruff check pipeline api contracts
          ruff format --check pipeline api contracts
      - name: Pytest (offline)
        working-directory: pipeline
        run: pytest -q -m "not network"

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          pip install -e "pipeline[dev]"
          npm ci --prefix web
      - name: Regenerate types and fail if stale
        run: |
          make contracts
          git diff --exit-code -- pipeline/src/planetes/contracts.py web/src/types/contracts.ts \
            || { echo "::error::Generated contract files are stale. Run 'make contracts' and commit."; exit 1; }
      - name: Validate baked data
        run: make validate

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
