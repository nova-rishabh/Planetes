# Render Blueprint: API only. The website is deployed on Vercel (project root: web/).
services:
  - type: web
    name: planetes-api
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: pip install -e ./pipeline && pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_FRAMES
        value: "60"
      - key: IRSA_CONCURRENCY
        value: "8"
      - key: JOB_WORKERS
        value: "2"
      - key: CACHE_DIR
        value: /tmp/planetes-cache
      - key: GCS_BUCKET
        value: planetes-cache
      - key: GCP_SERVICE_ACCOUNT_JSON
        sync: false
