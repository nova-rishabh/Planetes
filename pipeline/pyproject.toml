[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planetes"
description = "Planetes: SPHEREx time-lapses, spectra and Two Opinions (NASA Space Apps 2026)."
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dynamic = ["version"]
dependencies = [
  "astropy",
  "astroquery",
  "pyvo",
  "numpy",
  "scipy",
  "photutils",
  "reproject",
  "Pillow",
  "sbpy",
  "pydantic>=2",
  "pandas",
  "requests",
]

[project.optional-dependencies]
# Dev tools are pinned so generated files and lint results are identical locally and in CI.
dev = [
  "pytest==9.2.0",
  "datamodel-code-generator==0.91.0",
  "jsonschema==4.26.0",
  "ruff==0.17.4",
]

[tool.setuptools.dynamic]
version = { attr = "planetes.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "../api/tests"]
pythonpath = [".."]
markers = [
  "network: test makes real requests to external services (IRSA, CDS, ...)",
]
